name: Scrape & Validate

on:
  # Cron utlumen po turnaji 2026 — scrape se spouští už jen ručně (workflow_dispatch).
  # Pro obnovení (např. příští ročník) odkomentuj schedule blok níže.
  # schedule:
  #   # Baseline — vždy běží, zachytí změny rozpisu mimo turnaj.
  #   - cron: '*/15 * * * *'
  #   # Dense — během turnaje (gated v prvním kroku přes data/matches.json).
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      cf_cron:
        description: 'Spuštěno Cloudflare Worker cronem (gated stejně jako */5)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # Opt-in do Node.js 24 runnerů (Node 20 je deprecated od září 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dense cron (*/5) a Cloudflare Worker dispatch (cf_cron=true) běží jen
      # v turnajovém okně odvozeném z data/matches.json. Baseline cron (*/15)
      # a ruční workflow_dispatch (cf_cron=false) běží vždy.
      - name: Decide whether to scrape
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ] || [ "${{ github.event.inputs.cf_cron }}" = "true" ]; then
            node scripts/in-tournament-window.mjs
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      # pnpm verze je definovaná v package.json přes "packageManager" — žádný `version:`
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --prod --frozen-lockfile
        if: steps.gate.outputs.proceed == 'true'

      - name: Run tests
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm test

      - id: scrape
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm scrape
        continue-on-error: true

      - name: Validate generated JSON
        if: steps.gate.outputs.proceed == 'true' && steps.scrape.outcome == 'success'
        run: |
          set -e
          echo "Validating data/table.json..."
          jq . data/table.json > /dev/null && echo "✓ table.json is valid"
          echo "Validating data/matches.json..."
          jq . data/matches.json > /dev/null && echo "✓ matches.json is valid"
          echo "Validating data/meta.json..."
          jq . data/meta.json > /dev/null && echo "✓ meta.json is valid"
          echo "All JSON files are valid!"

      - name: Commit if changed
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ) [${{ steps.scrape.outcome }}]"
            # Pojistka proti race s ručním pushem nebo překryvem běhů
            git pull --rebase origin main
            git push
          fi

      - name: Fail if scraper failed
        if: steps.gate.outputs.proceed == 'true' && steps.scrape.outcome != 'success'
        run: |
          echo "Scraper exited with status: ${{ steps.scrape.outcome }}"
          exit 1

