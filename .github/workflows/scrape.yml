name: Scrape & Validate

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-and-demos
  cancel-in-progress: false

env:
  # Opt-in do Node.js 24 runnerů (Node 20 je deprecated od září 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm verze je definovaná v package.json přes "packageManager" — žádný `version:`
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --prod --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - id: scrape
        run: pnpm scrape
        continue-on-error: true

      - name: Validate generated JSON
        if: steps.scrape.outcome == 'success'
        run: |
          set -e
          echo "Validating data/table.json..."
          jq . data/table.json > /dev/null && echo "✓ table.json is valid"
          echo "Validating data/matches.json..."
          jq . data/matches.json > /dev/null && echo "✓ matches.json is valid"
          echo "Validating data/meta.json..."
          jq . data/meta.json > /dev/null && echo "✓ meta.json is valid"
          echo "All JSON files are valid!"

      - name: Commit if changed
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ) [${{ steps.scrape.outcome }}]"
            # Pojistka proti race s ručním pushem nebo překryvem běhů
            git pull --rebase origin main
            git push
          fi

      - name: Fail if scraper failed
        if: steps.scrape.outcome != 'success'
        run: |
          echo "Scraper exited with status: ${{ steps.scrape.outcome }}"
          exit 1

  regenerate-demos:
    runs-on: ubuntu-latest
    name: Regenerate demo scenarios
    needs: scrape
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --prod --frozen-lockfile

      - name: Generate demo scenarios
        run: node scripts/generate-demos.mjs
        continue-on-error: true

      - name: Validate demo JSON
        run: |
          set -e
          echo "Validating data/demo/index.json..."
          jq . data/demo/index.json > /dev/null && echo "✓ index.json is valid"
          for dir in data/demo/*/; do
            slug=$(basename "$dir")
            for file in "table.json" "matches.json" "meta.json"; do
              if [ -f "$dir$file" ]; then
                jq . "$dir$file" > /dev/null && echo "✓ demo/$slug/$file is valid"
              fi
            done
          done
          echo "All demo JSON files are valid!"

      - name: Commit demos if changed
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/demo/
          if git diff --quiet --cached; then
            echo "No demo changes"
          else
            git commit -m "demos: regenerate scenarios"
            # Scrape job mohl pushnout mezi spuštěním tohoto jobu a teď — dohnat
            git pull --rebase origin main
            git push
          fi

